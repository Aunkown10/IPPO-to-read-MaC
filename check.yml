name: Check Ippo to Read
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential pkg-config libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install JavaScript dependencies
        run: npm install
      - name: Reader logic tests
        run: npm test
      - name: Type check and build frontend
        run: npm run build
      - name: Native core tests
        run: cargo test -p ippo-core
      - name: Check native desktop
        run: cargo check -p ippo-desktop
